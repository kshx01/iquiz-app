<style>
/* Layout: jedna "pozornica" po pitanju – broj pitanja gore, tekst u sredini, akcije uvijek na dnu pod palcem. Plava je zaštitni znak IQuiza. */
:root{
  --bg:#eef3fa; --surface:#ffffff; --ink:#0f1b2d; --muted:#56677f; --line:#d3deec;
  --plum:#1f4fa3; --plum-soft:#e1eaf8; --gold:#b9770e; --gold-soft:#fbf1dd;
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --surface:#16213a; --ink:#e9f0fa; --muted:#9aabc4; --line:#2a3a56;
  --plum:#8fb7ff; --plum-soft:#1b2b47; --gold:#f2b84b; --gold-soft:#2e2618; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1420; --surface:#16213a; --ink:#e9f0fa; --muted:#9aabc4; --line:#2a3a56;
  --plum:#8fb7ff; --plum-soft:#1b2b47; --gold:#f2b84b; --gold-soft:#2e2618; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:46rem;margin:0 auto;padding:0 16px;min-height:100%;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Prekidač teme */
.theme-switch{display:inline-flex;align-items:center;gap:.45rem;background:transparent;color:var(--muted);font-family:var(--font-display);font-weight:500;font-size:.85rem;padding:.3rem 0}
.theme-switch .track{position:relative;width:2.6rem;height:1.5rem;border-radius:999px;background:var(--plum-soft);border:1px solid var(--line);transition:background .2s}
.theme-switch .knob{position:absolute;top:50%;left:.15rem;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transform:translateY(-50%);transition:left .2s;display:grid;place-items:center;font-size:.7rem;line-height:1}
.theme-switch[aria-checked="true"] .track{background:var(--plum)}
.theme-switch[aria-checked="true"] .knob{left:calc(100% - 1.3rem)}
.theme-switch .knob::before{content:"☀"}
.theme-switch[aria-checked="true"] .knob::before{content:"☾"}
.home{position:relative}
.home .theme-switch{position:absolute;top:1rem;right:0}
.tb-right{display:flex;align-items:center;gap:.9rem}
@media (prefers-reduced-motion:reduce){.theme-switch .track,.theme-switch .knob{transition:none}}

/* Početni zaslon */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2rem;padding-block:2.5rem}
.brand{display:flex;flex-direction:column;gap:.5rem}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--plum)}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2.6rem,11vw,4.2rem);line-height:.95;letter-spacing:-.02em;margin:0;text-wrap:balance}
.brand h1 span{color:var(--plum)}
.brand p{margin:0;color:var(--muted);max-width:32rem}
.modes{display:grid;gap:.75rem}
.mode{display:flex;justify-content:space-between;align-items:center;gap:1rem;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem}
.mode strong{display:block;font-family:var(--font-display);font-weight:700;font-size:1.25rem}
.mode small{color:var(--muted);font-size:.9rem}
.mode .arrow{font-family:var(--font-display);font-size:1.6rem;color:var(--plum)}
.mode.resume{background:var(--plum);color:var(--bg);border-color:var(--plum)}
.mode.resume small,.mode.resume .arrow{color:var(--bg);opacity:.85}
.startat{display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.startat input{width:5.5rem;font:inherit;font-variant-numeric:tabular-nums;padding:.4rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}

/* Zaslon pitanja */
.play{flex:1;display:flex;flex-direction:column;padding-block:1rem 0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-bottom:.75rem;border-bottom:1px solid var(--line)}
.ghost{background:transparent;color:var(--muted);font-family:var(--font-display);font-weight:500;font-size:.95rem;padding:.4rem .2rem}
.count{font-family:var(--font-display);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.stage{flex:1;display:flex;flex-direction:column;gap:1.1rem;padding-block:1.4rem 1.5rem}
.qnum{font-family:var(--font-display);font-weight:800;font-size:clamp(2.8rem,13vw,4.5rem);line-height:.9;color:var(--plum);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.qtext{font-size:clamp(1.15rem,4.6vw,1.45rem);line-height:1.5;white-space:pre-line;margin:0;max-width:62ch}
.imgs{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr))}
.imgs figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:4rem}
.imgs img{display:block;width:100%;max-height:55vh;object-fit:contain}
.imgs figure{position:relative}
.imgs figcaption{position:absolute;top:.4rem;left:.4rem;background:#1f3a68;color:#fff;font-family:var(--font-display);font-weight:700;font-size:.85rem;padding:.15rem .5rem;border-radius:6px}
.imgs a{display:block;padding:1rem;font-family:var(--font-display);font-weight:600;color:var(--plum);text-align:center}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding-left:.7rem;margin:0}
.reveal{display:flex;flex-direction:column;gap:.8rem}
.answer{background:#1f3a68;color:#fff;border-radius:12px;padding:1rem 1.1rem}
.answer .lbl{color:#f2c46b}
.answer p{color:#fff}
.answer .lbl,.explain .lbl{font-family:var(--font-display);font-weight:700;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.25rem}
.answer p{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(1.25rem,5vw,1.6rem);line-height:1.25;white-space:pre-line}
.explain{padding:0 .2rem}
.explain .lbl{color:var(--plum)}
.answer .lbl{color:#f2c46b}
.explain p{margin:0;color:var(--ink);max-width:62ch}

.actions{position:sticky;bottom:0;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:.6rem;padding-block:.8rem calc(.8rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.btn{border-radius:12px;padding:.95rem .8rem;font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.btn.soft{background:var(--plum-soft);color:var(--plum)}
.btn.soft[aria-pressed="true"]{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.btn.main{background:var(--plum);color:var(--bg)}

.done{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.2rem;padding-block:2rem}
.done h2{font-family:var(--font-display);font-weight:800;font-size:2.2rem;line-height:1;margin:0}
.done p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.reveal>*{animation:rise .25s ease-out}}
@keyframes rise{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

<script>
(function(){var t=null;try{t=localStorage.getItem('iquiz-theme');}catch(e){}if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>

    </div>
    <div class="stage" id="stage" aria-live="polite">

      <p class="qtext" id="qtext"></p>
      <div class="imgs" id="imgs" hidden></div>
      <p class="note" id="note" hidden></p>

    <div class="actions">
      <button class="btn soft" id="btnAns" aria-pressed="false">Odgovor</button>
      <button class="btn main" id="btnNext">Sljedeće →</button>
    </div>
  </section>

  <section class="done" id="done" hidden>
    <span class="eyebrow">Kraj kruga</span>
    <h2 id="doneTitle">Odigrana su sva pitanja</h2>
    <p id="doneText"></p>
    <div class="modes">
      <button class="mode" id="btnAgain"><span><strong>Novi krug</strong><small>Ponovno promiješaj sva pitanja</small></span><span class="arrow" aria-hidden="true">→</span></button>
      <button class="mode" id="btnDoneHome"><span><strong>Izbornik</strong><small>Natrag na početak</small></span><span class="arrow" aria-hidden="true">→</span></button>
    </div>
  </section>
</div>

<script>
(function(){
  const Q = JSON.parse(document.getElementById('data').textContent).sort((a,b)=>a.broj-b.broj);
  const KEY = 'iquiz-vecer-v1';
  const $ = id => document.getElementById(id);

  // Tema: ručni prekidač, zapamćen po uređaju; bez izbora prati postavku sustava.
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  const isDark = () => { const a = document.documentElement.getAttribute('data-theme'); return a ? a === 'dark' : !!(mq && mq.matches); };
  const syncSwitches = () => { const d = isDark(); document.querySelectorAll('.theme-switch').forEach(b => b.setAttribute('aria-checked', d ? 'true' : 'false')); const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', d ? '#0d1420' : '#1f4fa3'); };
  document.querySelectorAll('.theme-switch').forEach(b => b.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('iquiz-theme', next); } catch(e){}
    syncSwitches();
  }));
  if (mq && mq.addEventListener) mq.addEventListener('change', syncSwitches);
  syncSwitches();
  let st = null; // {mode, order:[idx], pos}

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };

  function shuffle(n){
    const a = Array.from({length:n},(_,i)=>i);
    for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function show(id){ ['home','play','done'].forEach(s=>$(s).hidden = s!==id); window.scrollTo(0,0); }

  function renderHome(){
    $('total').textContent = Q.length;
    const s = load();
    if (s && s.order && s.pos < s.order.length){
      $('btnResume').hidden = false;
      const q = Q[s.order[s.pos]];
      $('resumeInfo').textContent = (s.mode==='rand' ? 'Nasumično' : 'Po redu') + ' · pitanje ' + q.broj + ' (' + (s.pos+1) + ' / ' + s.order.length + ')';
    } else $('btnResume').hidden = true;
    show('home');
  }

  function start(mode){
    if (mode === 'rand') st = {mode, order: shuffle(Q.length), pos: 0};
    else {
      const n = parseInt($('startNum').value,10) || 1;
      let from = Q.findIndex(q => q.broj >= n); if (from < 0) from = 0;
      st = {mode, order: Array.from({length:Q.length-from},(_,i)=>i+from), pos: 0};
    }
    save(); renderQ();
  }

  function setPressed(btn, on){ btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }

  function renderQ(){
    if (st.pos >= st.order.length){ renderDone(); return; }
    const q = Q[st.order[st.pos]];
    $('qnum').textContent = q.broj + '.';
    $('qtext').textContent = q.pitanje;
    $('count').textContent = (st.pos+1) + ' / ' + st.order.length;
    const urls = [q.url_slike, q.url_slike_2, q.url_slike_3, q.url_slike_4].filter(Boolean);
    const labs = q.oznake_slika || [];
    const box = $('imgs'); box.innerHTML = '';
    urls.forEach((u,i)=>{
      const f = document.createElement('figure');
      const img = new Image(); img.alt = 'Slika uz pitanje ' + q.broj; img.loading = 'eager'; img.referrerPolicy = 'no-referrer';
      img.onerror = () => { f.innerHTML = ''; const a=document.createElement('a'); a.href=u; a.target='_blank'; a.rel='noopener'; a.textContent='Otvori sliku' + (labs[i] ? ' ' + labs[i] : (urls.length>1 ? ' ' + (i+1) : '')) + ' ↗'; f.appendChild(a); };
      img.src = u; f.appendChild(img); if(labs[i]){ const c=document.createElement('figcaption'); c.textContent=labs[i]; f.appendChild(c); } box.appendChild(f);
    });
    box.hidden = urls.length === 0;
    $('note').hidden = !q.napomena; $('note').textContent = q.napomena || '';
    $('atext').textContent = q.odgovor || '';
    $('etext').textContent = q.pojasnjenje || '';
    $('answer').hidden = true; $('explain').hidden = true;
    setPressed($('btnAns'), false);
    $('btnPrev').style.visibility = st.pos > 0 ? 'visible' : 'hidden';
    $('btnNext').textContent = st.pos+1 < st.order.length ? 'Sljedeće →' : 'Završi krug →';
    show('play');
  }

  function renderDone(){
    $('doneText').textContent = st.mode==='rand'
      ? 'Svih ' + st.order.length + ' pitanja odigrano je bez ponavljanja.'
      : 'Došli ste do posljednjeg pitanja.';
    $('btnAgain').querySelector('small').textContent = st.mode==='rand' ? 'Ponovno promiješaj sva pitanja' : 'Kreni ponovno od pitanja 1';
    show('done');
  }

  function toggleAnswer(){ const open = $('answer').hidden; $('answer').hidden = !open; $('explain').hidden = !open || !$('etext').textContent; setPressed($('btnAns'), open); if(open) $('answer').scrollIntoView({block:'nearest', behavior:'smooth'}); }

  $('btnSeq').onclick = () => start('seq');
  $('btnRand').onclick = () => start('rand');
  $('btnResume').onclick = () => { st = load(); renderQ(); };
  $('startNum').oninput = () => { $('seqFrom').textContent = parseInt($('startNum').value,10) || 1; };
  $('btnAns').onclick = toggleAnswer;
  $('btnNext').onclick = () => { st.pos++; save(); renderQ(); };
  $('btnPrev').onclick = () => { if (st.pos>0){ st.pos--; save(); renderQ(); } };
  $('btnHome').onclick = renderHome;
  $('btnDoneHome').onclick = () => { try{ localStorage.removeItem(KEY); }catch(e){} renderHome(); };
  $('btnAgain').onclick = () => { if (st.mode==='rand') start('rand'); else { $('startNum').value = 1; start('seq'); } };

  document.addEventListener('keydown', e => {
    if ($('play').hidden || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'n') $('btnNext').click();
    else if (e.key === 'ArrowLeft') $('btnPrev').click();
    else if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); $('btnAns').click(); }
  });

  // Zaslon ne gasi se dok traje kviz (ako browser dopušta)
  let lock = null;
  async function wake(){ try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release',()=>lock=null); } } catch(e){} }
  document.addEventListener('click', wake, {once:false});
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') wake(); });

  renderHome();
})();
</script>
